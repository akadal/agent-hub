# Agent Hub — local-first Docker Compose stack
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# Endpoints (host):
#   Web:  http://localhost:27342  (container listens on 80 — Coolify-friendly)
#   API:  http://localhost:27341  (container 27341; not required publicly if web proxies /api)
#   Dummy SSH: localhost:27343 → container 27343 (root / targetpass)
#   From API container, register address "ssh-target" port 27343.
#
# Tailscale (100.x) SSH:
#   Bridge containers (10.x/172.x) cannot use the host tailnet → handshake timeout.
#   Coolify/Linux VPS (Tailscale on host):
#     docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d --build
#   Docker Desktop macOS:
#     docker compose -f docker-compose.yml -f docker-compose.host-api.yml up -d --build web ssh-target
#     ./scripts/run-api-host.sh
#
# Coolify: point the domain at the **web** service, port **80**.
# Login (bootstrap): admin / 123456  (override via BOOTSTRAP_ADMIN_*)
# Coolify host must be on the same tailnet (or use LAN IPs) for 100.x SSH.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-hub-api
    ports:
      - "${API_PORT:-27341}:27341"
    environment:
      HTTP_ADDR: ":27341"
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-agent-hub}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-forever}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-123456}
      DATA_DIR: /data
      ACCESS_DEFAULT_TAILSCALE_ONLY: ${ACCESS_DEFAULT_TAILSCALE_ONLY:-false}
      # Optional: Machines page "Import from Tailscale" (API access token, not auth key)
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY:-}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:-}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:27341/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      ssh-target:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Force empty — never bake host-local API into the SPA image.
        VITE_API_BASE_URL: ""
    container_name: agent-hub-web
    ports:
      # Host 27342 → container 80 (proxy/Coolify should target container port 80)
      - "${WEB_PORT:-27342}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ssh-target:
    build:
      context: ./deploy/ssh-target
      dockerfile: Dockerfile
    container_name: agent-hub-ssh-target
    ports:
      - "${SSH_TARGET_PORT:-27343}:27343"
    restart: unless-stopped

volumes:
  api-data:
