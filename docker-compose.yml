# Agent Hub — local-first Docker Compose stack
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# Endpoints (host) — uncommon defaults to avoid Coolify/shared-host clashes:
#   API:  http://localhost:27341
#   Web:  http://localhost:27342
#   Dummy SSH target: localhost:27343 (user root / pass targetpass)
#   From API container, register address "ssh-target" port 27343.
#
# Login (bootstrap): admin / 123456  (override via BOOTSTRAP_ADMIN_*)

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-hub-api
    ports:
      - "${API_PORT:-27341}:27341"
    environment:
      HTTP_ADDR: ":27341"
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-agent-hub}
      # forever | 0 | never | or Go duration e.g. 24h
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-forever}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-123456}
      DATA_DIR: /data
      ACCESS_DEFAULT_TAILSCALE_ONLY: ${ACCESS_DEFAULT_TAILSCALE_ONLY:-false}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:27341/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      ssh-target:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:27341}
    container_name: agent-hub-web
    ports:
      - "${WEB_PORT:-27342}:27342"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Dummy remote host for e2e: register as address=ssh-target, port=27343
  ssh-target:
    build:
      context: ./deploy/ssh-target
      dockerfile: Dockerfile
    container_name: agent-hub-ssh-target
    ports:
      - "${SSH_TARGET_PORT:-27343}:27343"
    restart: unless-stopped

volumes:
  api-data:
