name: CI

# The repo ships tests for the SSH bridge, the store and the HTTP surface, but
# nothing ran them on a pull request — a contributor could only find out they
# broke the terminal bridge after merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        # Several tests dial TEST-NET addresses and wait out a real timeout, so
        # the default 10m package limit is tighter than it looks.
        run: go test -timeout 5m ./...

  frontend:
    name: Web SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci so a drifted lockfile fails the build instead of being quietly
      # patched over. See CONTRIBUTING.md for regenerating it on linux.
      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: web
        run: npm run lint
      - name: test
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build

  compose:
    name: Compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and start the stack
        run: docker compose up -d --build
      - name: wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:27341/health >/dev/null 2>&1; then
              echo "api healthy"; exit 0
            fi
            sleep 2
          done
          echo "api never became healthy"; docker compose logs --no-color; exit 1
      - name: smoke
        run: ./scripts/e2e-smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: tear down
        if: always()
        run: docker compose down -v
